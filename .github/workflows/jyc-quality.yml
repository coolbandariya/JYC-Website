name: JYC Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: jyc-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Static QA
        run: npm run qa

      - name: Production build
        run: npm run build

      - name: Production performance budget
        run: node scripts/qa-performance.mjs

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser QA
        run: npm run qa:browser

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: jyc-playwright-diagnostics
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
